<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
  <!--
    offyx — Draft v2-02: Der Punkt
    Kursive Wordmark + Kupfer-Punkt am Ende.
    Wie ein Satz, der endet. Der Punkt ist das einzige Markenelement.
  -->

  <!-- Cream-Hintergrund -->
  <rect width="1024" height="512" fill="#FBF7F1"/>

  <!-- Wordmark mit Copper-Punkt -->
  <text x="512" y="296"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="150"
        font-weight="400"
        letter-spacing="-2"
        text-anchor="middle"><tspan fill="#352E28">offyx</tspan><tspan fill="#B5632A">.</tspan></text>
</svg>
