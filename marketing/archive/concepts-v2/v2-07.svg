<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
  <!--
    offyx — Draft v2-07: Die Einkreisung
    Handgezeichneter Copper-Kreis um das Wort —
    als hätte jemand es auf der Seite eingekringelt.
  -->

  <!-- Cream-Hintergrund -->
  <rect width="1024" height="512" fill="#FBF7F1"/>

  <!-- Wordmark -->
  <text x="512" y="296"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="150"
        font-weight="400"
        fill="#352E28"
        letter-spacing="-2"
        text-anchor="middle">offyx</text>

  <!-- Handgezeichneter Kreis: leicht unregelmäßige Ellipse -->
  <path d="M 278 240
           C 285 165, 400 128, 530 132
           C 655 136, 748 185, 742 252
           C 736 322, 630 362, 495 360
           C 365 358, 272 315, 278 240"
        stroke="#B5632A"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Doppelstrich am Anfang — der Stift setzt zweimal an -->
  <path d="M 278 240
           C 282 222, 290 206, 302 192"
        stroke="#B5632A"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        opacity="0.4"/>
</svg>
