<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
  <!--
    offyx — Draft v2-10: Notizbuch
    Kursive Wordmark auf liniertem Papier.
    Die Basislinie der Schrift liegt exakt auf einer Papierlinie —
    die y-Unterlänge taucht darunter, wie handschriftlich notiert.
    "Papier & Tinte" als wörtliche Bühne.
  -->

  <!-- Cream-Hintergrund -->
  <rect width="1024" height="512" fill="#FBF7F1"/>

  <!-- Liniertes Papier: horizontale Linien im 44px-Raster -->
  <g stroke="#352E28" stroke-width="1" opacity="0.07">
    <line x1="0" y1="120" x2="1024" y2="120"/>
    <line x1="0" y1="164" x2="1024" y2="164"/>
    <line x1="0" y1="208" x2="1024" y2="208"/>
    <line x1="0" y1="252" x2="1024" y2="252"/>
    <line x1="0" y1="296" x2="1024" y2="296"/>
    <line x1="0" y1="340" x2="1024" y2="340"/>
    <line x1="0" y1="384" x2="1024" y2="384"/>
    <line x1="0" y1="428" x2="1024" y2="428"/>
  </g>

  <!-- Marginale: vertikale Copper-Linie links, wie im Notizbuch -->
  <line x1="180" y1="96" x2="180" y2="440"
        stroke="#B5632A" stroke-width="1.2" opacity="0.18"/>

  <!-- Wordmark: Basislinie exakt auf der Papierlinie y=296 -->
  <text x="512" y="296"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="150"
        font-weight="400"
        fill="#352E28"
        letter-spacing="-2"
        text-anchor="middle">offyx</text>
</svg>
