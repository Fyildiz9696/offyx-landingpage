<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- offyx — Logo Horizontal Dark (auf dunklem Hintergrund) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&amp;display=swap');
    </style>
  </defs>

  <!-- Icon: Siegel-Mark (invertiert) -->
  <circle cx="20" cy="20" r="17" stroke="#FBF7F1" stroke-width="1.8" fill="#352E28"/>
  <circle cx="20" cy="20" r="10" stroke="#B5632A" stroke-width="1.2" fill="none" opacity="0.6"/>
  <circle cx="20" cy="20" r="4" fill="#B5632A"/>
  <circle cx="32" cy="8" r="2.5" fill="#B5632A"/>

  <!-- Wordmark: offyx (hell) -->
  <text
    x="48"
    y="27"
    font-family="'Playfair Display', Georgia, serif"
    font-size="22.4"
    font-weight="400"
    fill="#FBF7F1"
    letter-spacing="-0.67"
  >offyx</text>
</svg>
