<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
  <!--
    offyx — Draft 9: Kolophon-Stern
    Typografisches Druckerzeichen (6-zackiger Asterisk / Kolophon-Stern) als Markenzeichen.
    Referenz: Buchdruckerei-Ornamentik, Fußnotenzeichen, alte Verlagsmarken.
    CI: Ink #352E28 · Copper #B5632A · Cream #FBF7F1
  -->

  <!-- ── ICON: Kolophon-Asterisk ── -->
  <g id="icon" transform="translate(44, 56)">

    <!-- Hintergrundkreis: sehr subtil -->
    <circle cx="186" cy="200" r="158" fill="#F7F1E8"/>
    <circle cx="186" cy="200" r="148" stroke="#352E28" stroke-width="0.8" fill="none" opacity="0.2"/>

    <!-- 6-zackiger Asterisk: 3 Linien durch Mittelpunkt, 60° Abstände -->
    <!-- Linie 1: horizontal -->
    <line x1="48"  y1="200" x2="324" y2="200"
          stroke="#B5632A" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Linie 2: 60° -->
    <line x1="48"  y1="200" x2="324" y2="200"
          stroke="#B5632A" stroke-width="3.2" stroke-linecap="round"
          transform="rotate(60, 186, 200)"/>
    <!-- Linie 3: 120° -->
    <line x1="48"  y1="200" x2="324" y2="200"
          stroke="#B5632A" stroke-width="3.2" stroke-linecap="round"
          transform="rotate(120, 186, 200)"/>

    <!-- Sechs Endpunkt-Ornamente -->
    <!-- Horizontale Endpunkte -->
    <circle cx="48"  cy="200" r="5.5" fill="#B5632A"/>
    <circle cx="324" cy="200" r="5.5" fill="#B5632A"/>
    <!-- 60°-Endpunkte: center (186,200), (186-138*cos60, 200-138*sin60) = (117, 81.5) & (255, 318.5) -->
    <!-- rotate(60): effectively at 60° from center -->
    <!-- (186 + 138*cos(60°), 200 - 138*sin(60°)) = (186+69, 200-119.5) = (255, 80.5) -->
    <!-- (186 - 138*cos(60°), 200 + 138*sin(60°)) = (186-69, 200+119.5) = (117, 319.5) -->
    <circle cx="255" cy="80"  r="5.5" fill="#B5632A"/>
    <circle cx="117" cy="320" r="5.5" fill="#B5632A"/>
    <!-- 120°-Endpunkte: -->
    <!-- (186 + 138*cos(120°), 200 - 138*sin(120°)) = (186-69, 200-119.5) = (117, 80.5) -->
    <!-- (186 - 138*cos(120°), 200 + 138*sin(120°)) = (186+69, 200+119.5) = (255, 319.5) -->
    <circle cx="117" cy="80"  r="5.5" fill="#B5632A"/>
    <circle cx="255" cy="320" r="5.5" fill="#B5632A"/>

    <!-- Mittelpunkt: konzentrisch, Ink & Copper -->
    <circle cx="186" cy="200" r="14" fill="#352E28"/>
    <circle cx="186" cy="200" r="8"  fill="#B5632A"/>
    <circle cx="186" cy="200" r="4"  fill="#F7F1E8"/>

    <!-- Äußerer Kupfer-Kreis: zieht den Asterisk zusammen -->
    <circle cx="186" cy="200" r="80"
            stroke="#B5632A" stroke-width="0.9" fill="none" opacity="0.3"/>

    <!-- Ink Außenring: sehr dünn -->
    <circle cx="186" cy="200" r="115"
            stroke="#352E28" stroke-width="0.8" fill="none" opacity="0.25"/>
  </g>

  <!-- ── WORDMARK ── -->
  <g id="wordmark" transform="translate(450, 60)">

    <!-- Micro-Label mit Ornament-Strichen -->
    <rect x="0"  y="162" width="36" height="1.5" fill="#B5632A" opacity="0.6"/>
    <text x="46" y="175"
          font-family="'Work Sans', Helvetica, Arial, sans-serif"
          font-size="16" font-weight="500"
          fill="#B5632A"
          letter-spacing="7">KOLOPHON</text>
    <rect x="196" y="162" width="36" height="1.5" fill="#B5632A" opacity="0.6"/>

    <!-- Hauptname -->
    <text x="0" y="302"
          font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
          font-size="138" font-weight="400"
          fill="#352E28"
          letter-spacing="-4">offyx</text>

    <!-- Doppel-Regel: fein -->
    <rect x="0" y="318" width="510" height="1.2" fill="#352E28" opacity="0.22"/>
    <rect x="0" y="323" width="200" height="0.8" fill="#B5632A" opacity="0.5"/>

    <!-- Subtitle -->
    <text x="0" y="362"
          font-family="'Work Sans', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="300"
          fill="#9B8E82"
          letter-spacing="4">Virtual Office · Berlin</text>

    <!-- Typografische Fußnote (Ast-Referenz): kleiner Stern rechts unten -->
    <text x="505" y="362"
          font-family="'Playfair Display', Georgia, serif"
          font-size="18"
          fill="#B5632A"
          text-anchor="end">✦</text>
  </g>
</svg>
