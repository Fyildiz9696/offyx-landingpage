<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none">
  <!--
    offyx — Draft 7: Blocksatz
    Gespaltenes Farbfeld — kein separates Icon.
    Der Wordmark überspannt die Grenze zwischen Ink und Paper.
    Linke Hälfte: Ink-Block, Cream-Text. Rechte Hälfte: Paper, Ink-Text.
    Die Farbe des Textes wechselt an der exakten Mittellinie.
    CI: Ink #352E28 · Copper #B5632A · Cream #FBF7F1
  -->
  <defs>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="512" height="512"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="512" y="0" width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- ── HINTERGRÜNDE ── -->
  <!-- Linke Hälfte: Ink -->
  <rect x="0" y="0" width="512" height="512" fill="#352E28"/>
  <!-- Rechte Hälfte: Paper -->
  <rect x="512" y="0" width="512" height="512" fill="#F7F1E8"/>

  <!-- Kupfer-Trennlinie (haarfein) -->
  <rect x="511" y="0" width="2" height="512" fill="#B5632A" opacity="0.8"/>

  <!-- ── WORDMARK: gespaltener Text ── -->
  <!-- Gleicher Text, zweimal gerendert, je mit Clip und passender Farbe -->
  <!-- Text-Baseline bei y=310, zentriert bei x=512 -->

  <!-- Cream-Version (sichtbar auf Ink-Hintergrund, links) -->
  <text x="512" y="310"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="170" font-weight="400"
        fill="#FBF7F1"
        letter-spacing="-5"
        text-anchor="middle"
        clip-path="url(#clip-left)">offyx</text>

  <!-- Ink-Version (sichtbar auf Paper-Hintergrund, rechts) -->
  <text x="512" y="310"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="170" font-weight="400"
        fill="#352E28"
        letter-spacing="-5"
        text-anchor="middle"
        clip-path="url(#clip-right)">offyx</text>

  <!-- ── DETAILS LINKS (auf Ink) ── -->
  <!-- Eyebrow links oben -->
  <text x="48" y="96"
        font-family="'Work Sans', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500"
        fill="#FBF7F1"
        letter-spacing="7"
        opacity="0.38">VIRTUAL OFFICE</text>

  <!-- Copper-Akzentpunkt oben links -->
  <circle cx="460" cy="72" r="5" fill="#B5632A"/>

  <!-- Feine Kupfer-Horizontallinie auf Ink-Seite, unter Wortmarke -->
  <rect x="48" y="348" width="200" height="1" fill="#B5632A" opacity="0.55"
        clip-path="url(#clip-left)"/>

  <!-- ── DETAILS RECHTS (auf Paper) ── -->
  <!-- Subtitle rechts unten -->
  <text x="976" y="416"
        font-family="'Work Sans', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="300"
        fill="#7A6A5E"
        letter-spacing="5"
        text-anchor="end"
        clip-path="url(#clip-right)">Berlin · Laubacher Str. 44</text>

  <!-- Copper-Linie rechts oben -->
  <rect x="560" y="92" width="80" height="1.2" fill="#B5632A" opacity="0.6"
        clip-path="url(#clip-right)"/>
  <text x="656" y="100"
        font-family="'Work Sans', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500"
        fill="#9B8E82"
        letter-spacing="5"
        clip-path="url(#clip-right)">BERLIN</text>
</svg>
